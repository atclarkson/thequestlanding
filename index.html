<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE QUEST</title>
<meta name="description" content="THE QUEST — coming soon." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♛</text></svg>" />
<style>
  :root {
    --bg: #0a0a0c;
    --gold: #c9a24b;
    --gold-dim: #6b5a2e;
    --text: #e8e3d8;
    --text-dim: #8a857a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  .bg-glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 30%, rgba(201, 162, 75, 0.08), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(201, 162, 75, 0.05), transparent 70%);
    pointer-events: none;
  }

  .grid-lines {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 620px;
  }

  .mark {
    font-size: 1.6rem;
    color: var(--gold);
    letter-spacing: 0.3em;
    margin-bottom: 1.75rem;
    opacity: 0.85;
  }

  h1 {
    font-size: clamp(2.6rem, 9vw, 5.2rem);
    letter-spacing: 0.14em;
    margin: 0 0 1.4rem;
    font-weight: 400;
    text-transform: uppercase;
    background: linear-gradient(180deg, #f3e9cf 0%, var(--gold) 55%, var(--gold-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.05;
  }

  .tagline {
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    color: var(--text-dim);
    letter-spacing: 0.04em;
    line-height: 1.7;
    margin: 0 auto 2.6rem;
    max-width: 460px;
    font-style: italic;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.65rem 1.4rem;
    border: 1px solid rgba(201, 162, 75, 0.35);
    border-radius: 999px;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 1px rgba(201, 162, 75, 0.7);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  footer {
    position: fixed;
    bottom: 1.75rem;
    left: 0;
    right: 0;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    color: rgba(138, 133, 122, 0.5);
    z-index: 1;
  }

  @media (max-width: 480px) {
    .mark { letter-spacing: 0.2em; }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="grid-lines"></div>
  <main>
    <div class="mark">♛</div>
    <h1>The Quest</h1>
    <p class="tagline">A city. A crown. Nothing is scripted.</p>
    <div class="status"><span class="dot"></span>Coming soon</div>
  </main>
  <footer>&copy; 2026 THE QUEST</footer>
</body>
</html>
