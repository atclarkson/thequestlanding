<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE QUEST</title>
<meta name="description" content="THE QUEST — a family against a city. 24 hours of game time, spread across four days. Nothing is scripted." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='46' cy='46' r='34' fill='none' stroke='%231c1a17' stroke-width='9'/%3E%3Cpolygon points='46,10 54,42 46,50 38,42' fill='%231c1a17'/%3E%3Cpolygon points='82,46 50,54 42,46 50,38' fill='%231c1a17'/%3E%3Cpolygon points='46,82 38,50 46,42 54,50' fill='%231c1a17'/%3E%3Cpolygon points='10,46 42,38 50,46 42,54' fill='%231c1a17'/%3E%3Cpolygon points='62,62 92,92 96,88 66,58' fill='%231c1a17'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #efe6d2;
    --paper-dark: #e4d8bd;
    --ink: #1c1a17;
    --red: #d8483c;
    --blue: #2c5fa8;
    --yellow: #eab308;
    --cream-text: #f6f0e2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    background-image: radial-gradient(var(--ink) 1px, transparent 1px);
    background-size: 18px 18px;
    background-position: -9px -9px;
    background-color: var(--paper);
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: var(--paper);
    opacity: 0.86;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
  }

  .box {
    position: relative;
    background: var(--paper-dark);
    border: 7px solid var(--ink);
    border-radius: 10px;
    box-shadow: 12px 12px 0 var(--ink);
    padding: 3rem 2.25rem 2.5rem;
    text-align: center;
  }

  .stamp {
    position: absolute;
    top: -22px;
    right: -18px;
    background: var(--yellow);
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    font-family: 'Anton', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    transform: rotate(9deg);
    box-shadow: 5px 5px 0 var(--ink);
  }

  .kicker {
    display: inline-block;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    background: var(--blue);
    color: var(--cream-text);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    margin-bottom: 1.75rem;
  }

  .mark {
    width: 96px;
    height: 96px;
    margin: 0 auto 0.75rem;
    display: block;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 11vw, 4.6rem);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 0.9rem;
    line-height: 0.95;
  }

  .rule {
    width: 84px;
    height: 6px;
    background: var(--red);
    border: 2px solid var(--ink);
    margin: 0 auto 1.4rem;
  }

  .lede {
    font-family: 'Anton', sans-serif;
    font-size: clamp(1.15rem, 3.6vw, 1.5rem);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0 0 0.9rem;
  }

  .sub {
    font-size: 0.98rem;
    font-weight: 500;
    line-height: 1.65;
    color: #423d34;
    max-width: 440px;
    margin: 0 auto 2rem;
  }

  .stats {
    display: flex;
    gap: 0.85rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2.25rem;
  }

  .stat {
    border: 4px solid var(--ink);
    border-radius: 8px;
    padding: 0.75rem 1.1rem;
    font-family: 'Anton', sans-serif;
    color: var(--cream-text);
    box-shadow: 5px 5px 0 var(--ink);
    min-width: 100px;
  }
  .stat span {
    display: block;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    margin-top: 0.2rem;
    opacity: 0.9;
  }
  .stat.n1 { background: var(--red); transform: rotate(-2deg); font-size: 1.5rem; }
  .stat.n2 { background: var(--blue); transform: rotate(1.5deg); font-size: 1.5rem; }
  .stat.n3 { background: var(--ink); transform: rotate(-1deg); font-size: 1.5rem; }

  form.signup {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 0.9rem;
  }

  .signup label.hdr {
    display: block;
    font-family: 'Anton', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }

  input[type="email"] {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.8rem 1rem;
    border: 3px solid var(--ink);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    min-width: 220px;
    flex: 1 1 220px;
  }
  input[type="email"]::placeholder { color: #7a7361; }
  input[type="email"]:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }

  button.go {
    font-family: 'Anton', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--cream-text);
    background: var(--red);
    border: 3px solid var(--ink);
    border-radius: 6px;
    padding: 0.8rem 1.4rem;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button.go:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  button.go:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

  .note {
    font-size: 0.78rem;
    color: #6b6455;
    font-weight: 500;
  }
  .note.ok { color: #2c6e3f; font-weight: 700; }

  footer {
    margin-top: 1.75rem;
    text-align: center;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6b6455;
  }

  @media (max-width: 480px) {
    .box { padding: 2.5rem 1.4rem 2rem; }
    .stat { min-width: 84px; padding: 0.65rem 0.8rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="stamp">IN DEVELOPMENT</div>
      <span class="kicker">A Family vs. A City</span>

      <svg class="mark" viewBox="0 0 100 100" aria-label="The Quest compass mark">
        <circle cx="46" cy="46" r="34" fill="none" stroke="var(--ink)" stroke-width="9"/>
        <polygon points="46,10 54,42 46,50 38,42" fill="var(--ink)"/>
        <polygon points="82,46 50,54 42,46 50,38" fill="var(--ink)"/>
        <polygon points="46,82 38,50 46,42 54,50" fill="var(--ink)"/>
        <polygon points="10,46 42,38 50,46 42,54" fill="var(--ink)"/>
        <polygon points="62,62 92,92 96,88 66,58" fill="var(--ink)"/>
      </svg>

      <h1>The Quest</h1>
      <div class="rule"></div>

      <p class="lede">Nothing is scripted.</p>
      <p class="sub">
        24 hours of game time, spread across four days. One family against
        one city — every zone earned, never given.
      </p>

      <div class="stats">
        <div class="stat n1">24<span>Hours</span></div>
        <div class="stat n2">4<span>Days</span></div>
        <div class="stat n3">1<span>City</span></div>
      </div>

      <form class="signup" action="https://formspree.io/f/moeqndpb" method="POST">
        <label class="hdr" for="email">Be the first to play</label>
        <input id="email" name="email" type="email" placeholder="your@email.com" required />
        <button class="go" type="submit">Notify Me</button>
      </form>
      <p class="note">No spam. One email when the first season is announced.</p>
    </div>
    <footer>@thequestgame &middot; &copy; 2026 The Quest</footer>
  </div>
</body>
</html>
